# Sample configuration for testing

user: "testuser"

stats:
  enabled:
    - overview
    - heatmap
    - languages
    - fun
    - streaks
  thresholds:
    high_volume_commits: 1000
    active_contributor_stars: 100
    night_owl_hour_start: 22
    night_owl_hour_end: 4
    early_bird_hour_start: 5
    early_bird_hour_end: 9

visualization:
  theme: "spark-dark"
  effects:
    glow: true
    gradient: false
    animations: false
  branding:
    show_powered_by: true

cache:
  enabled: true
  directory: ".cache"
  # Cache invalidates based on repository pushed_at timestamps

repositories:
  max_count: 500
  exclude_private: true
  exclude_forks: true
  exclude_archived: true

github:
  api_version:
    enabled: false
    version: "2026-03-10"
    fallback_to_default: true

enrichment:
  pull_requests:
    enabled: true
    max_pages: 3
  security:
    enabled: true
    allow_partial: true
