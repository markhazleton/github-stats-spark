# Stats Spark - Automated GitHub Statistics Generation
# Generates SVG visualizations weekly at midnight UTC on Sundays
# Can also be triggered manually via workflow_dispatch

name: Generate GitHub Statistics

on:
  # Automated weekly generation at midnight UTC on Sundays
  schedule:
    - cron: '0 0 * * 0'

  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      report_mode:
        description: 'Report generation mode'
        required: false
        default: 'unified'
        type: choice
        options:
          - unified
          - dated
          - both
      capture_screenshots:
        description: 'Capture website screenshots'
        required: false
        default: false
        type: boolean

  # Trigger on push to main branch (for testing)
  push:
    branches:
      - main
      - 001-stats-spark
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.documentation/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write  # Required to commit generated SVGs

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    name: Generate Statistics
    env:
      SPARK_CACHE_DIR: .cache/ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          git fetch origin
          git pull origin ${{ github.ref_name }} --rebase || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

        - name: Enforce Core Module Coverage Gate
        if: ${{ github.event_name == 'push' }}
        run: |
          pytest --cov=spark --cov-report=json:coverage.json --cov-report=term-missing:skip-covered -q
          python - <<'PY'
          import json
          import sys

          threshold = 80.0
          targets = [
            "src/spark/calculator.py",
            "src/spark/visualizer.py",
            "src/spark/fetcher.py",
            "src/spark/cache.py",
            "src/spark/summarizer.py",
            "src/spark/unified_report_workflow.py",
            "src/spark/ranker.py",
          ]

          with open("coverage.json", "r", encoding="utf-8") as fh:
            payload = json.load(fh)

          files = payload.get("files", {})
          failures = []

          for path in targets:
            metrics = files.get(path)
            if not metrics:
              failures.append((path, "missing"))
              continue
            percent = float(metrics.get("summary", {}).get("percent_covered", 0.0))
            if percent < threshold:
              failures.append((path, f"{percent:.1f}%"))

          if failures:
            print("Core coverage gate failed (<80%):")
            for path, value in failures:
              print(f" - {path}: {value}")
            sys.exit(1)

          print("Core coverage gate passed for all target modules.")
          PY

      - name: Restore CI cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SPARK_CACHE_DIR }}
          key: ${{ runner.os }}-spark-cache-${{ github.ref_name }}-${{ hashFiles('config/spark.yml', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-spark-cache-${{ github.ref_name }}-
            ${{ runner.os }}-spark-cache-

      - name: Install Playwright for screenshots
        if: ${{ inputs.capture_screenshots == true }}
        run: |
          echo "Installing Playwright browsers for screenshot capture..."
          playwright install chromium --with-deps

      - name: Inspect CI cache
        run: |
          if [ -d "$SPARK_CACHE_DIR" ]; then
            echo "✅ Cache directory exists with $(find "$SPARK_CACHE_DIR" -type f | wc -l) files"
            echo "Cache size: $(du -sh "$SPARK_CACHE_DIR" | cut -f1)"
            ls -lh "$SPARK_CACHE_DIR" | head -20
          else
            echo "⚠️  No cache directory found, will build from scratch"
          fi

      - name: Verify API Keys
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "⚠️  WARNING: ANTHROPIC_API_KEY not set - AI summaries will be skipped"
            echo "To enable AI summaries, add ANTHROPIC_API_KEY to repository secrets"
          else
            echo "✅ ANTHROPIC_API_KEY is configured"
          fi

      - name: Generate unified data and statistics with AI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Starting unified generation with AI-powered repository summaries..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Cache Status Before Generation"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Cache dir: $SPARK_CACHE_DIR"
          echo "Total cache files: $(find "$SPARK_CACHE_DIR" -type f 2>/dev/null | wc -l)"
          echo "Cache size: $(du -sh "$SPARK_CACHE_DIR" 2>/dev/null | cut -f1)"
          echo "AI summaries: $(find "$SPARK_CACHE_DIR" -path '*/ai_summary/*.json' 2>/dev/null | wc -l)"
          echo "Commit caches: $(find "$SPARK_CACHE_DIR" -path '*/commit_counts/*.json' 2>/dev/null | wc -l)"
          echo ""
          
          # Build command with optional screenshots
          SCREENSHOT_FLAG=""
          if [ "${{ inputs.capture_screenshots }}" == "true" ]; then
            SCREENSHOT_FLAG="--capture-screenshots"
            echo "📸 Screenshots enabled"
          fi
          
          spark unified --user ${{ github.repository_owner }} --include-ai-summaries $SCREENSHOT_FLAG --verbose
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Cache Status After Generation"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Total cache files: $(find "$SPARK_CACHE_DIR" -type f 2>/dev/null | wc -l)"
          echo "Cache size: $(du -sh "$SPARK_CACHE_DIR" 2>/dev/null | cut -f1)"
          echo "AI summaries: $(find "$SPARK_CACHE_DIR" -path '*/ai_summary/*.json' 2>/dev/null | wc -l)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check if data changed
        id: data-check
        run: |
          if git diff --quiet data/repositories.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare frontend data directory
        if: steps.data-check.outputs.changed == 'true'
        run: |
          echo "Creating frontend public/data symlink..."
          rm -f frontend/public/data
          ln -s ../../data frontend/public/data
          ls -la frontend/public/

      - name: Install frontend dependencies
        if: steps.data-check.outputs.changed == 'true'
        working-directory: ./frontend
        run: npm install

      - name: Build dashboard
        if: steps.data-check.outputs.changed == 'true'
        working-directory: ./frontend
        run: npm run build

      - name: Copy data to docs
        if: steps.data-check.outputs.changed == 'true'
        run: |
          echo "Copying data directory to docs..."
          mkdir -p docs/data
          cp -r data/repositories.json docs/data/
          ls -la docs/data/

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la docs/
          ls -la docs/assets/
          ls -la docs/data/
          if [ -d "docs/output/screenshots" ]; then
            echo "Screenshots copied successfully:"
            ls -la docs/output/screenshots/
          else
            echo "⚠️ No screenshots in docs/output/screenshots/"
          fi
          echo "Build verification complete"

      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/*.svg output/reports/*.md data/*.json docs/
          # Add screenshots if they exist
          if [ -d "output/screenshots" ]; then
            git add output/screenshots/
          fi
          git diff --staged --quiet || git commit -m "Update GitHub statistics and dashboard [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-statistics
          path: output/*.svg
          retention-days: 30

# Setup Instructions:
# 1. Fork this repository
# 2. GitHub token (GITHUB_TOKEN) is automatically available in workflows
# 3. Enable GitHub Actions in repository settings
# 4. Workflow will run weekly on Sundays at midnight UTC
# 5. Manually trigger from Actions tab for immediate generation
# 6. Generated SVGs will be committed to the output/ directory
