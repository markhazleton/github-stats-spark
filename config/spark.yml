# Stats Spark Configuration
# GitHub Profile Statistics Generator

# GitHub usernames to analyze.
# The first entry is the default user for the dashboard and single-user runs.
# Add more entries to process multiple users in one pipeline run.
users:
  - markhazleton

# Statistics Configuration
stats:
  # Enabled statistics categories (choose which SVGs to generate)
  # Available: overview, heatmap, languages, fun, streaks
  enabled:
    - overview    # Comprehensive dashboard with Spark Score
    - heatmap     # Commit frequency calendar
    - languages   # Programming language breakdown
    - fun         # Lightning Round Stats - fun facts
    - streaks     # Coding and learning streaks
    - release     # Release cadence sparklines (weekly/monthly repo diversity)

  # Thresholds for categorization
  thresholds:
    graveyard_months: 6        # Months of inactivity to mark as inactive
    starter_commits: 50        # Commits threshold for "starter" designation
    power_user_commits: 1000   # Commits threshold for "power user" designation
    night_owl_hours: [22, 23, 0, 1, 2, 3, 4]    # Hours for night owl detection
    early_bird_hours: [5, 6, 7, 8, 9]           # Hours for early bird detection

# Visualization Configuration
visualization:
  # Theme: spark-dark, spark-light, or custom theme name from themes.yml
  theme: spark-dark

  # Visual style: electric (default), minimal, detailed
  style: electric

  # SVG output categories (same as stats.enabled, kept for compatibility)
  outputs:
    - overview
    - heatmap
    - languages
    - fun
    - streaks
    - release

  # Visual effects
  effects:
    glow: true        # Enable glow effects
    animations: false # Enable animations (not supported in GitHub READMEs)
    gradient: true    # Enable gradient fills

# Branding Configuration
branding:
  show_logo: true             # Show Stats Spark logo
  show_powered_by: true       # Show "Powered by Stats Spark" footer
  custom_footer: ""           # Custom footer text (optional)

# Cache Configuration
cache:
  enabled: true               # Enable API response caching
  directory: .cache           # Default cache directory (override with SPARK_CACHE_DIR)

  # Smart Cache Strategy (commit-driven invalidation):
  # - All repository-scoped caches only refresh when new commits are detected
  # - Cache validity determined by comparing repository push_at timestamps
  # - Commit stats, languages, READMEs, dependencies, and AI summaries persist until code changes
  # - Old commits remain cached indefinitely (commits never change once created)
  #
  # Performance: Only repos with new commits trigger fresh API calls
  # Expected cache hit rate: >95% for weekly runs, near 100% for inactive repositories

# Repository Limits
repositories:
  max_count: 500              # Maximum repositories to process
  exclude_private: true       # Exclude private repositories (per constitution)
  exclude_forks: true         # Exclude forked repositories
  exclude_archived: true      # Exclude archived repositories

# Repository Analysis Configuration
analyzer:
  # Top N repositories to include in analysis report
  top_n: 50

  # AI Provider for repository summarization
  ai_provider: anthropic      # Options: anthropic, openai, disabled

  # Model selection (if ai_provider enabled)
  ai_model: claude-haiku-4-5  # Claude Haiku for cost-effective summaries

  # Cache duration for external dependency version checks (days)
  dependency_cache_ttl: 7     # 7 days for package registry API responses

  # Supported dependency ecosystems
  dependency_ecosystems:
    - npm                     # JavaScript/TypeScript (package.json)
    - pypi                    # Python (requirements.txt, pyproject.toml)
    - rubygems                # Ruby (Gemfile)
    - go                      # Go (go.mod)
    - maven                   # Java (pom.xml)
    - nuget                   # .NET (*.csproj)

  # Ranking algorithm weights (must sum to 1.0)
  ranking_weights:
    popularity: 0.30          # Stars, forks, watchers
    activity: 0.45            # Recent commits, recency
    health: 0.25              # Documentation, maturity, issues

# Staged GitHub REST API version rollout controls
github:
  api_version:
    enabled: false            # Set true to send explicit version header
    version: "2026-03-10"    # Target staged API version
    fallback_to_default: true # Retry once without explicit version header

# Repository Comparison Dashboard Configuration
dashboard:
  # Enable dashboard generation
  enabled: true

  # Output directory for dashboard data (source data, not build output)
  output_dir: data

  # Dashboard features to enable
  visualizations:
    - table               # Repository overview table
    - bar_chart           # Bar charts for metric comparison
    - line_graph          # Line graphs for trend analysis
    - scatter_plot        # Scatter plots for pattern detection
    - comparison          # Side-by-side repository comparison

  # Dashboard data generation settings
  data_generation:
    # Include commit size metrics (avg/largest/smallest) from per-commit stats API calls.
    # Disabled by default to reduce API volume and focus on summary-relevant signals.
    include_commit_metrics: false

    # Include language statistics
    include_language_stats: true

    # Include repository insight metrics (contributor_stats, code_frequency).
    # Uses repository-level stats endpoints and caches negative results to reduce repeat calls.
    include_repo_insights: true

    # Include AI-generated summaries (from unified report)
    include_ai_summaries: true

    # Max commits to fetch per repository (lower value reduces API calls/rate-limit pressure)
    max_commits_per_repo: 10

    # Max commits scanned when building commit count windows (90/180/365d)
    # Keep this higher than max_commits_per_repo for better trend quality.
    commit_count_scan_limit: 200

    # Max repositories to include in dashboard
    max_repositories: 50   # Max repositories to include in dashboard

  # Performance optimization settings
  performance:
    # Enable client-side data compression
    compress_json: false

    # Dashboard data refresh interval (hours)
    # Note: Backend cache uses pushed_at-based invalidation
    cache_ttl_hours: 6

    # Lazy load visualization components
    lazy_load_charts: true

# Scan Configuration (Principle VI: Generated Artifact Boundary)
# Paths excluded from ALL source-level security and quality scans.
# Maintained here as the single source of truth per constitution.
scan:
  exclude_paths:
    - docs/assets/        # Built Vite/JS bundles (GitHub Pages output)
    - docs/data/          # Generated JSON data artifacts
    - docs/output/        # Generated SVG/report output
    - htmlcov/            # Python coverage report HTML artifacts
    - output/             # Generated reports and SVGs
    - MagicMock/          # Test mock artifacts
    - preview/            # Local preview build output
  exclude_patterns:
    - "*.min.js"          # Minified JavaScript bundles
    - "*.map"             # Source map files
  source_paths:           # Only these trees are scanned for source analysis
    - src/
    - frontend/src/
    - config/
    - .github/
